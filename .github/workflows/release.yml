name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 1.0.0"
        required: true

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          CODE=$(grep -oP '__version__ = "\K[^"]+' src/writeassist/__init__.py)
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          [ -n "$V" ] || V="$CODE"
          if [ "$V" != "$CODE" ]; then
            echo "::error::Tag $V does not match __version__ $CODE in src/writeassist/__init__.py"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: PYTHONPATH=src:tests python tests/run_all.py

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . "pyinstaller>=6,<7" pillow

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/writeassist.spec

      - name: Smoke test CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then dist/writeassist/writeassist --version
          elif [ "$RUNNER_OS" = "Windows" ]; then dist/writeassist/writeassist.exe --version
          else dist/writeassist/writeassist --version; fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh "$VERSION" amd64
          tar -C dist -czf "dist/writeassist-$VERSION-linux-x86_64.tar.gz" writeassist
          packaging/build-extension.sh "$VERSION"
          mkdir -p out && cp dist/*.deb dist/*.tar.gz dist/*-extension.zip out/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH="${{ matrix.target }}"; ARCH="${ARCH#macos-}"
          mkdir -p out
          ditto -c -k --keepParent dist/WriteAssist.app "out/WriteAssist-$VERSION-macos-$ARCH.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\writeassist.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\WriteAssist-Setup-$env:VERSION.exe" out\
          Compress-Archive -Path dist\writeassist\* -DestinationPath "out\writeassist-$env:VERSION-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: WriteAssist ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/*
      - name: Trigger Landing Page Refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "pages.yml trigger skipped"
